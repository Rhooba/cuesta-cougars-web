<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Cuesta Cougars Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-orange-50 to-amber-100 flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">

        <div class="text-center mb-6">
            <div class="text-4xl mb-2">🍔</div>
            <h1 class="text-2xl font-bold text-gray-900">Create an Account</h1>
            <p class="text-gray-500 mt-1 text-sm">Join Cuesta Cougars Delivery</p>
        </div>

        <div th:if="${error}"
             class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-5 text-sm flex items-center gap-2">
            <span>⚠️</span> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post" class="space-y-4" id="regForm">

            <!-- Role selector -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">I am a...</label>
                <div class="grid grid-cols-3 gap-2" id="roleGroup">
                    <label class="cursor-pointer select-none">
                        <input type="radio" name="type" value="customer" class="sr-only" checked>
                        <div class="role-card border-2 border-orange-500 bg-orange-50 text-orange-700 rounded-lg p-2 text-center text-sm font-medium transition">
                            🛍️ Customer
                        </div>
                    </label>
                    <label class="cursor-pointer select-none">
                        <input type="radio" name="type" value="driver" class="sr-only">
                        <div class="role-card border border-gray-200 text-gray-600 rounded-lg p-2 text-center text-sm font-medium transition hover:border-orange-300">
                            🚗 Driver
                        </div>
                    </label>
                    <label class="cursor-pointer select-none">
                        <input type="radio" name="type" value="admin" class="sr-only">
                        <div class="role-card border border-gray-200 text-gray-600 rounded-lg p-2 text-center text-sm font-medium transition hover:border-orange-300">
                            ⚙️ Admin
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" name="name" required
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900
                              focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent"
                       placeholder="Your full name">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900
                              focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent"
                       placeholder="Choose a username">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Password <span class="text-gray-400 text-xs font-normal">(min. 6 characters)</span>
                </label>
                <input type="password" name="password" required
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900
                              focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent"
                       placeholder="Choose a password">
            </div>

            <!-- Customer-only field -->
            <div id="addressField">
                <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Address</label>
                <input type="text" name="address"
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900
                              focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent"
                       placeholder="e.g. 123 Main St, San Luis Obispo">
            </div>

            <!-- Driver-only field -->
            <div id="locationField" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Current Location</label>
                <input type="text" name="location"
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900
                              focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent"
                       placeholder="e.g. San Luis Obispo">
            </div>

            <button type="submit"
                    class="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700
                           text-white font-semibold py-2.5 rounded-lg transition duration-150 text-base">
                Create Account
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-5">
            Already have an account?
            <a th:href="@{/}" class="text-orange-500 hover:text-orange-600 font-medium">Sign in</a>
        </p>
    </div>

    <script>
        const radios = document.querySelectorAll('input[name="type"]');
        const cards  = document.querySelectorAll('.role-card');
        const addressField  = document.getElementById('addressField');
        const locationField = document.getElementById('locationField');

        function updateUI() {
            const selected = document.querySelector('input[name="type"]:checked').value;
            // Update card styles
            radios.forEach((r, i) => {
                if (r.checked) {
                    cards[i].className = 'role-card border-2 border-orange-500 bg-orange-50 text-orange-700 rounded-lg p-2 text-center text-sm font-medium transition';
                } else {
                    cards[i].className = 'role-card border border-gray-200 text-gray-600 rounded-lg p-2 text-center text-sm font-medium transition hover:border-orange-300';
                }
            });
            // Toggle conditional fields
            addressField.classList.toggle('hidden', selected !== 'customer');
            locationField.classList.toggle('hidden', selected !== 'driver');
        }

        radios.forEach(r => r.addEventListener('change', updateUI));
    </script>
</body>
</html>
