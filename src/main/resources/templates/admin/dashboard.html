<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Cuesta Cougars</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Nav -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">⚙️</span>
                <span class="font-bold text-lg text-gray-900">Cuesta Cougars</span>
                <span class="ml-2 text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-medium">Admin</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-600 hidden sm:inline">
                    <strong th:text="${name}">Admin</strong>
                </span>
                <a th:href="@{/logout}"
                   class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition font-medium">
                    Logout
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6">

        <!-- Flash messages -->
        <div th:if="${msg == 'added'}"   class="bg-green-50 border border-green-200 text-green-800 rounded-lg px-4 py-3 mb-5 text-sm flex items-center gap-2">✅ Menu item added.</div>
        <div th:if="${msg == 'removed'}" class="bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-4 py-3 mb-5 text-sm flex items-center gap-2">🗑️ Menu item removed.</div>
        <div th:if="${msg == 'updated'}" class="bg-blue-50 border border-blue-200 text-blue-800 rounded-lg px-4 py-3 mb-5 text-sm flex items-center gap-2">✏️ Menu item updated.</div>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

            <!-- Left: Menu Management (3/5 width) -->
            <div class="lg:col-span-3 space-y-5">

                <!-- Add New Item -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-4">➕ Add Menu Item</h2>
                    <form th:action="@{/admin/menu/add}" method="post" class="flex gap-3">
                        <input type="text" name="itemName" required placeholder="Item name"
                               class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm
                                      focus:outline-none focus:ring-2 focus:ring-orange-400">
                        <input type="number" name="price" required placeholder="Price" step="0.01" min="0.01"
                               class="w-28 border border-gray-300 rounded-lg px-3 py-2 text-sm
                                      focus:outline-none focus:ring-2 focus:ring-orange-400">
                        <button type="submit"
                                class="bg-orange-500 hover:bg-orange-600 text-white font-semibold
                                       px-4 py-2 rounded-lg transition text-sm flex-shrink-0">
                            Add
                        </button>
                    </form>
                </div>

                <!-- Current Menu -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-4">🍽️ Current Menu</h2>

                    <div th:if="${#lists.isEmpty(menu)}"
                         class="text-center py-6 text-gray-400 text-sm">
                        No menu items yet.
                    </div>

                    <div th:unless="${#lists.isEmpty(menu)}" class="space-y-3">
                        <div th:each="item : ${menu}"
                             class="flex items-center gap-3 p-3 border border-gray-100 rounded-lg bg-gray-50">

                            <!-- Item info -->
                            <div class="flex-1 min-w-0">
                                <span class="font-medium text-gray-800" th:text="${item.itemName}">Item</span>
                            </div>

                            <!-- Inline update form -->
                            <form th:action="@{/admin/menu/update}" method="post" class="flex items-center gap-2">
                                <input type="hidden" name="itemName" th:value="${item.itemName}">
                                <input type="number" name="price" step="0.01" min="0.01"
                                       th:value="${#numbers.formatDecimal(item.price, 1, 2)}"
                                       class="w-24 border border-gray-300 rounded-lg px-2 py-1.5 text-sm
                                              focus:outline-none focus:ring-2 focus:ring-blue-400 text-right">
                                <button type="submit"
                                        class="bg-blue-500 hover:bg-blue-600 text-white text-xs
                                               px-2.5 py-1.5 rounded-lg transition font-medium">
                                    Save
                                </button>
                            </form>

                            <!-- Remove form -->
                            <form th:action="@{/admin/menu/remove}" method="post"
                                  onsubmit="return confirm('Remove this item?')">
                                <input type="hidden" name="itemName" th:value="${item.itemName}">
                                <button type="submit"
                                        class="bg-red-100 hover:bg-red-200 text-red-600 text-xs
                                               px-2.5 py-1.5 rounded-lg transition font-medium">
                                    Remove
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: All Orders (2/5 width) -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-4">📦 All Orders</h2>

                    <div th:if="${#lists.isEmpty(orders)}"
                         class="text-center py-8 text-gray-400 text-sm">
                        No orders placed this session.
                    </div>

                    <div th:unless="${#lists.isEmpty(orders)}" class="space-y-3">
                        <div th:each="order : ${orders}"
                             class="border border-gray-100 rounded-lg p-3 bg-gray-50">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-semibold text-gray-900 text-sm">
                                    Order #<span th:text="${order.orderId}"></span>
                                </span>
                                <span th:text="${order.status}"
                                      th:class="${order.status.name() == 'DELIVERED' ? 'text-xs px-2 py-0.5 rounded-full font-medium bg-green-100 text-green-700' : (order.status.name() == 'PLACED' ? 'text-xs px-2 py-0.5 rounded-full font-medium bg-amber-100 text-amber-700' : (order.status.name() == 'PICKED_UP' ? 'text-xs px-2 py-0.5 rounded-full font-medium bg-purple-100 text-purple-700' : 'text-xs px-2 py-0.5 rounded-full font-medium bg-blue-100 text-blue-700'))}">
                                </span>
                            </div>
                            <p class="text-xs text-gray-500">
                                Customer: <span th:text="${order.customer.username}"></span>
                            </p>
                            <p class="text-xs text-gray-500">
                                Driver: <span th:text="${order.assignedDriver != null ? order.assignedDriver.name : 'Unassigned'}"></span>
                            </p>
                            <p class="text-xs font-semibold text-gray-700 mt-1">
                                Total: <span th:text="'$' + ${#numbers.formatDecimal(order.total, 1, 2)}"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
